name: Release

# Runs the test suite on every push and pull request. When the push is a
# version tag (v1.2.3), it additionally cross-compiles link-auditor for
# Linux, macOS, and Windows and publishes the binaries as a GitHub Release.
on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]

permissions:
  contents: write # required for the release job to publish a GitHub Release

env:
  # Kept in sync with the "go" directive in go.mod. golang.org/x/net (and,
  # transitively, golang.org/x/sys) currently require Go 1.25+; the rest of
  # this codebase only relies on Go 1.22-level language features.
  GO_VERSION: "1.25"

jobs:
  test:
    name: Test (${{ matrix.os }})
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Verify formatting
        if: runner.os != 'Windows'
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "The following files are not gofmt-formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test -race -cover ./...

      - name: Build
        run: go build ./...

  release:
    name: Build & publish release binaries
    if: startsWith(github.ref, 'refs/tags/v')
    needs: test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: amd64
          - goos: darwin
            goarch: arm64
          - goos: windows
            goarch: amd64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
          cache: true

      - name: Build binary
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          CGO_ENABLED: "0"
        run: |
          set -euo pipefail

          VERSION="${GITHUB_REF_NAME}"
          COMMIT="$(git rev-parse --short HEAD)"
          BUILD_DATE="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PKG="github.com/stackadnan/link-auditor/cmd"

          OUT_DIR="dist/link-auditor_${VERSION}_${GOOS}_${GOARCH}"
          mkdir -p "${OUT_DIR}"

          BIN_NAME="link-auditor"
          if [ "${GOOS}" = "windows" ]; then
            BIN_NAME="link-auditor.exe"
          fi

          go build \
            -trimpath \
            -ldflags "-s -w -X ${PKG}.Version=${VERSION} -X ${PKG}.Commit=${COMMIT} -X ${PKG}.BuildDate=${BUILD_DATE}" \
            -o "${OUT_DIR}/${BIN_NAME}" \
            .

          cp README.md LICENSE "${OUT_DIR}/" 2>/dev/null || cp README.md "${OUT_DIR}/"

          cd dist
          if [ "${GOOS}" = "windows" ]; then
            ARCHIVE="link-auditor_${VERSION}_${GOOS}_${GOARCH}.zip"
            zip -r "${ARCHIVE}" "link-auditor_${VERSION}_${GOOS}_${GOARCH}"
          else
            ARCHIVE="link-auditor_${VERSION}_${GOOS}_${GOARCH}.tar.gz"
            tar -czf "${ARCHIVE}" "link-auditor_${VERSION}_${GOOS}_${GOARCH}"
          fi
          sha256sum "${ARCHIVE}" >> checksums.txt

      - name: Upload archive artifact
        uses: actions/upload-artifact@v4
        with:
          name: link-auditor_${{ matrix.goos }}_${{ matrix.goarch }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

      - name: Upload checksum artifact
        uses: actions/upload-artifact@v4
        with:
          name: checksums-${{ matrix.goos }}-${{ matrix.goarch }}
          path: dist/checksums.txt
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Merge checksums
        run: |
          find dist -name checksums.txt -exec cat {} \; > dist/checksums.txt.merged
          mv dist/checksums.txt.merged dist/checksums.txt

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          generate_release_notes: true
          files: |
            dist/**/*.tar.gz
            dist/**/*.zip
            dist/checksums.txt
